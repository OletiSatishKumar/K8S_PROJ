name: Update Image Tag in dev-values.yaml

on:
  repository_dispatch:
    types: [update_infra]

jobs:
  update-values:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Infra Repository
        uses: actions/checkout@v3
        with:
          repository: OletiSatishKumar/K8S_Capstone
          token: ${{ secrets.GH_TOKEN }}
          ref: master

      - name: Check and Update image tag
        id: update
        run: |
          TAG="${{ github.event.client_payload.tag }}"
          FILE="helm/flowershop/dev-values.yaml"
          
          echo "Looking for tag: $TAG in $FILE"
          
          # Check if tag already exists
          if grep -q "tag: \"$TAG\"" "$FILE"; then
            echo "Tag $TAG already exists. Skipping update."
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            echo "Updating tag to $TAG"
            sed -i "s|\(tag:\s*\).*|\1\"$TAG\"|" "$FILE"
            echo "updated=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.update.outputs.updated == 'true'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add helm/flowershop/dev-values.yaml
          git commit -m "Update image tag to ${{ github.event.client_payload.tag }}"
          git push origin master
